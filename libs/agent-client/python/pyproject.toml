[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p2claw-agent-client"
version = "0.1.0a0"
description = "Client for the p2claw agent's local API: manage apps, shares and email, and reach private apps shared from other machines."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "the p2claw authors" }]
keywords = ["p2claw", "peer-to-peer", "unix-socket"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
websocket = ["websockets>=13"]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "websockets>=13",
]

[tool.hatch.build.targets.wheel]
packages = ["p2claw_agent_client"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
