[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p2claw-identity-verify"
version = "0.1.0a0"
description = "Verify the X-P2claw-Identity-Token (EdDSA JWT) minted by p2claw agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "the p2claw contributors" }]
keywords = ["p2claw", "jwt", "eddsa", "identity"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
]
dependencies = [
  "PyJWT[crypto]>=2.9",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["p2claw_identity_verify"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
