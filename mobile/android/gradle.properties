# Workspace-wide Gradle config for the mobile Android side.

# Modern AGP requires AndroidX; non-negotiable for any 2024+ Android lib.
android.useAndroidX=true

# Kotlin code style. The Kotlin Gradle plugin emits a warning when this
# is missing; pin to official to silence it.
kotlin.code.style=official

# JVM args for the Gradle daemon. 2 GiB heap is enough for an Android
# Library module; tune up if the AAR ever grows enough that R8 OOMs.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Maven Central publish coordinates default to 0.0.0-SNAPSHOT — the CI
# workflow overrides with `-PVERSION_NAME=<git tag>` on a real release.
# Local Gradle invocations get the snapshot value, which (combined with
# the publish step gating on `mobile-v*` tag push) makes accidental
# Maven Central publishes effectively impossible from a dev machine.
VERSION_NAME=0.0.0-SNAPSHOT
