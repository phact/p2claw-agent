[package]
name = "p2claw-email-proto"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license = "MIT"

[lints]
workspace = true

[dependencies]
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
p2claw-identity = { path = "../identity" }
